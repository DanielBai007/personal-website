<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人网站 - 项目展示</title>
    
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VERF25MHYL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-VERF25MHYL', {
            page_title: '个人网站首页',
            page_location: window.location.href,
            content_group1: '首页'
        });
        
        // 自定义事件追踪
        function trackEvent(eventName, parameters = {}) {
            gtag('event', eventName, {
                event_category: 'User Interaction',
                event_label: parameters.label || '',
                value: parameters.value || 0,
                ...parameters
            });
        }
        
        // 页面加载完成后的追踪
        window.addEventListener('load', function() {
            trackEvent('page_loaded', {
                event_category: 'Page Performance',
                event_label: '首页加载完成'
            });
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0A0A0A;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }



        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-section {
            text-align: center;
            color: white;
            width: 100%;
        }

        .hero-title {
            font-size: 4.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            line-height: 1.1;
            width: max-content;
            margin-left: auto;
            margin-right: auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            background-image: linear-gradient(97deg, #0096FF, #BB64FF 42%, #F2416B 74%, #EB7500);
        }

        .hero-subtitle {
            font-size: 1.4rem;
            margin-bottom: 3rem;
            opacity: 0.9;
            font-weight: 300;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button, button::after {
            padding: 10px 50px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: transparent;
            position: relative;
        }

        .hero-button {
            padding: 10px 50px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: transparent;
            position: relative;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }

        .hero-button::after {
            --move1: inset(50% 50% 50% 50%);
            --move2: inset(31% 0 40% 0);
            --move3: inset(39% 0 15% 0);
            --move4: inset(45% 0 40% 0);
            --move5: inset(45% 0 6% 0);
            --move6: inset(14% 0 61% 0);
            clip-path: var(--move1);
            content: 'GLITCH';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: block;
            padding: 10px 50px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: transparent;
        }

        .hero-button:hover::after {
            animation: glitch_4011 1s;
            text-shadow: 10 10px 10px black;
            animation-timing-function: steps(2, end);
            text-shadow: -3px -3px 0px #1df2f0, 3px 3px 0px #E94BE8;
            background-color: transparent;
            border: 3px solid rgb(0, 255, 213);
        }

        .hero-button:hover {
            text-shadow: -1px -1px 0px #1df2f0, 1px 1px 0px #E94BE8;
            background-color: transparent;
            border: 1px solid rgb(0, 255, 213);
            box-shadow: 0px 10px 10px -10px rgb(0, 255, 213);
        }

        @keyframes glitch_4011 {
            0% {
                clip-path: var(--move1);
                transform: translate(0px,-10px);
            }
            10% {
                clip-path: var(--move2);
                transform: translate(-10px,10px);
            }
            20% {
                clip-path: var(--move3);
                transform: translate(10px,0px);
            }
            30% {
                clip-path: var(--move4);
                transform: translate(-10px,10px);
            }
            40% {
                clip-path: var(--move5);
                transform: translate(10px,-10px);
            }
            50% {
                clip-path: var(--move6);
                transform: translate(-10px,10px);
            }
            60% {
                clip-path: var(--move1);
                transform: translate(10px,-10px);
            }
            70% {
                clip-path: var(--move3);
                transform: translate(-10px,10px);
            }
            80% {
                clip-path: var(--move2);
                transform: translate(10px,-10px);
            }
            90% {
                clip-path: var(--move4);
                transform: translate(-10px,10px);
            }
            100% {
                clip-path: var(--move1);
                transform: translate(0);
            }
        }

        .button-icon {
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .hero-title {
                font-size: 2.8rem;
            }
            
            .hero-subtitle {
                font-size: 1.1rem;
                margin-bottom: 2.5rem;
            }
            
            .hero-buttons {
                flex-direction: column;
                gap: 1.5rem;
                align-items: center;
            }
            
            .hero-button {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero-section">
            <h1 class="hero-title">欢迎来到我的小站</h1>
            <p class="hero-subtitle">在这里你将能了解更多关于我的信息<br></p>
            
            <div class="hero-buttons">
                <a href="resume.html" class="hero-button">
                    个人简历
                </a>
                <a href="portfolio.html" class="hero-button">
                    作品展示
                </a>
            </div>
        </div>
    </div>

    <script>
        // 添加简单的页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const heroSection = document.querySelector('.hero-section');
            heroSection.style.opacity = '0';
            heroSection.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                heroSection.style.transition = 'opacity 1s ease, transform 1s ease';
                heroSection.style.opacity = '1';
                heroSection.style.transform = 'translateY(0)';
            }, 300);
        });
    </script>
</body>
</html>
