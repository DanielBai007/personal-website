<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目详情 - 讲次评价分析平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0A0A0A;
            min-height: 100vh;
            color: #333;
        }

        .navbar {
            background: #202937;
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .nav-logo span {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            opacity: 0.8;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateY(-2px);
            opacity: 1;
        }

        .nav-link.active {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            opacity: 1;
        }

        .container {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100vh;
            padding-top: 60px;
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 加载界面样式 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .loading-content {
            text-align: center;
            color: white;
            max-width: 450px;
            padding: 2rem;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #2BD2FF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #2BD2FF;
        }

        .loading-subtitle {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 1rem;
        }

        .loading-progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #2BD2FF, #00A8FF);
            border-radius: 2px;
            transition: width 0.3s ease;
            animation: pulse 2s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .loading-steps {
            text-align: left;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .loading-step {
            margin-bottom: 0.3rem;
            transition: color 0.3s ease;
        }

        .loading-step.completed {
            color: #2BD2FF;
        }

        .loading-step.current {
            color: #ffffff;
            font-weight: 500;
        }

        .loading-tips {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(43, 210, 255, 0.1);
            border-radius: 8px;
            border-left: 3px solid #2BD2FF;
        }

        .loading-tips h4 {
            color: #2BD2FF;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .loading-tips p {
            font-size: 0.85rem;
            opacity: 0.8;
            line-height: 1.4;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .skip-button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .skip-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .nav-container {
                padding: 0 1rem;
            }
            
            .loading-content {
                padding: 1rem;
                max-width: 320px;
            }
            
            .loading-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span>讲次评价分析平台</span>
            </div>
            <div class="nav-menu">
                <a href="../portfolio.html" class="nav-link">&larr; 返回作品集</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="iframe-container">
            <!-- 加载界面 -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-content">
                    <div class="loading-spinner"></div>
                    <h2 class="loading-title">正在准备数据分析平台</h2>
                    <p class="loading-subtitle">为您自动加载演示数据...</p>
                    <div class="loading-progress">
                        <div class="loading-progress-bar" id="progressBar" style="width: 10%"></div>
                    </div>
                    <div class="loading-steps">
                        <div class="loading-step" id="step1">📡 连接分析平台...</div>
                        <div class="loading-step" id="step2">📊 预加载课程评价数据...</div>
                        <div class="loading-step" id="step3">👨‍🏫 预加载主讲老师信息...</div>
                        <div class="loading-step" id="step4">⏳ 等待平台完全加载...</div>
                        <div class="loading-step" id="step5">🎯 准备演示环境...</div>
                    </div>
                    <div class="loading-tips">
                        <h4>💡 使用提示</h4>
                        <p>平台加载完成后，您可以：<br>
                        • 查看预置的13MB演示数据分析<br>
                        • 点击"更换数据"上传自己的数据<br>
                        • 体验完整的数据分析功能</p>
                    </div>
                    <button class="skip-button" onclick="skipLoading()">直接进入 →</button>
                </div>
            </div>
            
            <!-- 主要内容iframe -->
            <iframe 
                id="mainIframe" 
                src="about:blank" 
                title="讲次评价分析平台" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        class SmartPlatformLoader {
            constructor() {
                this.iframe = document.getElementById('mainIframe');
                this.loadingOverlay = document.getElementById('loadingOverlay');
                this.progressBar = document.getElementById('progressBar');
                this.evaluationData = null;
                this.teacherData = null;
                this.currentStep = 0;
                this.maxRetries = 3;
                this.retryCount = 0;
                
                this.steps = [
                    { id: 'step1', text: '📡 连接分析平台...', progress: 20 },
                    { id: 'step2', text: '📊 预加载课程评价数据...', progress: 40 },
                    { id: 'step3', text: '👨‍🏫 预加载主讲老师信息...', progress: 60 },
                    { id: 'step4', text: '⏳ 等待平台完全加载...', progress: 80 },
                    { id: 'step5', text: '🎯 准备演示环境...', progress: 100 }
                ];
                
                this.init();
            }

            async init() {
                try {
                    // 步骤1: 开始加载iframe
                    this.updateStep(0);
                    await this.loadPlatform();
                    
                    // 步骤2: 预加载评价数据
                    this.updateStep(1);
                    await this.preloadEvaluationData();
                    
                    // 步骤3: 预加载老师数据
                    this.updateStep(2);
                    await this.preloadTeacherData();
                    
                    // 步骤4: 等待iframe完全加载
                    this.updateStep(3);
                    await this.waitForPlatformReady();
                    
                    // 步骤5: 准备演示环境
                    this.updateStep(4);
                    await this.prepareDemo();
                    
                    // 显示使用提示并延迟隐藏
                    this.showFinalTips();
                    
                } catch (error) {
                    console.error('平台加载失败:', error);
                    this.showError('平台加载失败，但您仍可以手动使用');
                }
            }

            updateStep(stepIndex) {
                this.progressBar.style.width = this.steps[stepIndex].progress + '%';
                
                this.steps.forEach((step, index) => {
                    const element = document.getElementById(step.id);
                    if (index < stepIndex) {
                        element.className = 'loading-step completed';
                        element.innerHTML = step.text.replace('...', ' ✓');
                    } else if (index === stepIndex) {
                        element.className = 'loading-step current';
                        element.innerHTML = step.text;
                    } else {
                        element.className = 'loading-step';
                    }
                });
            }

            async loadPlatform() {
                return new Promise((resolve) => {
                    // 加载iframe
                    this.iframe.src = 'https://danielbai007.github.io/satisfaction_dashboard_2.0/';
                    
                    this.iframe.onload = () => {
                        console.log('Platform iframe loaded');
                        setTimeout(resolve, 1000);
                    };
                    
                    // 超时保护
                    setTimeout(() => {
                        console.log('Platform load timeout, continuing...');
                        resolve();
                    }, 10000);
                });
            }

            async preloadEvaluationData() {
                try {
                    const response = await fetch('../public/data/课程评价数据.csv');
                    if (!response.ok) throw new Error('Failed to fetch evaluation data');
                    
                    const csvText = await response.text();
                    this.evaluationData = new File([csvText], '课程评价数据.csv', {
                        type: 'text/csv'
                    });
                    
                    console.log('评价数据预加载完成，大小:', (this.evaluationData.size / 1024 / 1024).toFixed(2), 'MB');
                    
                    // 模拟处理时间
                    await new Promise(resolve => setTimeout(resolve, 800));
                    
                } catch (error) {
                    console.error('预加载评价数据失败:', error);
                    // 不阻止流程继续
                }
            }

            async preloadTeacherData() {
                try {
                    const response = await fetch('../public/data/课程场次.csv');
                    if (!response.ok) throw new Error('Failed to fetch teacher data');
                    
                    const csvText = await response.text();
                    this.teacherData = new File([csvText], '课程场次.csv', {
                        type: 'text/csv'
                    });
                    
                    console.log('主讲老师数据预加载完成，大小:', (this.teacherData.size / 1024).toFixed(2), 'KB');
                    
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                } catch (error) {
                    console.error('预加载老师数据失败:', error);
                }
            }

            async waitForPlatformReady() {
                // 等待平台完全加载和渲染
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // 尝试与iframe通信
                this.attemptCommunication();
            }

            attemptCommunication() {
                try {
                    // 尝试发送准备就绪的消息
                    this.iframe.contentWindow.postMessage({
                        type: 'PLATFORM_READY_CHECK',
                        timestamp: Date.now()
                    }, '*');
                } catch (error) {
                    console.log('通信尝试失败，这是正常的跨域限制');
                }
            }

            async prepareDemo() {
                // 准备演示环境的最后步骤
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                console.log('演示环境准备完成');
                console.log('数据状态:', {
                    evaluation: this.evaluationData ? '已加载' : '未加载',
                    teacher: this.teacherData ? '已加载' : '未加载'
                });
            }

            showFinalTips() {
                // 更新加载界面为最终提示
                const loadingContent = document.querySelector('.loading-content');
                loadingContent.innerHTML = `
                    <div class="loading-spinner" style="border-top-color: #4CAF50;"></div>
                    <h2 class="loading-title" style="color: #4CAF50;">✅ 平台加载完成！</h2>
                    <p class="loading-subtitle">演示数据已准备就绪</p>
                    <div class="loading-progress">
                        <div class="loading-progress-bar" style="width: 100%; background: #4CAF50;"></div>
                    </div>
                    <div class="loading-tips">
                        <h4>🎯 快速开始</h4>
                        <p><strong>方法一（推荐）</strong>：直接查看预置的演示数据分析结果<br>
                        <strong>方法二</strong>：点击"上传数据"按钮，手动上传您的数据文件<br>
                        <strong>数据说明</strong>：已为您准备13MB课程评价数据作为演示</p>
                    </div>
                    <button class="skip-button" onclick="hideLoading()" style="background: #4CAF50; border-color: #4CAF50;">
                        开始体验 🚀
                    </button>
                `;
                
                // 5秒后自动隐藏
                setTimeout(() => {
                    this.hideLoading();
                }, 5000);
            }

            hideLoading() {
                this.loadingOverlay.classList.add('hidden');
            }

            showError(message) {
                const loadingContent = document.querySelector('.loading-content');
                loadingContent.innerHTML = `
                    <div style="color: #ff6b6b; text-align: center;">
                        <h2>⚠️ ${message}</h2>
                        <p style="margin: 1rem 0;">平台已加载，您可以正常使用所有功能</p>
                        <div class="loading-tips">
                            <h4>📋 使用说明</h4>
                            <p>1. 点击"上传数据"按钮<br>
                            2. 选择您的CSV数据文件<br>
                            3. 点击"分析数据"开始分析</p>
                        </div>
                        <button onclick="hideLoading()" class="skip-button" style="background: #2BD2FF; border-color: #2BD2FF;">
                            继续使用
                        </button>
                    </div>
                `;
            }
        }

        // 全局函数
        function skipLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        // 页面加载完成后启动
        document.addEventListener('DOMContentLoaded', () => {
            new SmartPlatformLoader();
        });

        // 监听来自iframe的消息
        window.addEventListener('message', (event) => {
            if (event.origin !== 'https://danielbai007.github.io') {
                return; // 安全检查
            }
            
            console.log('收到iframe消息:', event.data);
            
            if (event.data.type === 'PLATFORM_LOADED') {
                console.log('平台已完全加载');
            }
        });
    </script>
</body>
</html>
